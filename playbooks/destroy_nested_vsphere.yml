---
# Destroy playbook for nested vSphere environment
# Removes all resources created by deploy_nested_vsphere.yml

- name: Destroy Nested vSphere Environment
  hosts: localhost
  gather_facts: false
  vars:
    # Load deployment state or topology file
    # Auto-detect state file from vsphere_topology.yml deployment_name
    _topology_for_name: "{{ lookup('file', playbook_dir ~ '/../vsphere_topology.yml') | from_yaml }}"
    deployment_name: "{{ lookup('env', 'DEPLOYMENT_NAME') | default(_topology_for_name.deployment_name, true) }}"
    state_file: "{{ playbook_dir }}/../state/{{ deployment_name }}_deployment.yml"
    topology_file: "{{ lookup('env', 'VSPHERE_TOPOLOGY_FILE') | default('vsphere_topology.yml', true) }}"
    # Resolve topology file path relative to project root
    _topology_file_path: >-
      {{
        topology_file if topology_file.startswith('/')
        else playbook_dir ~ '/../' ~ topology_file
      }}

    # Destroy mode: 'soft' removes config but keeps VMs, 'hard' removes everything
    destroy_mode: "{{ lookup('env', 'DESTROY_MODE') | default('hard', true) }}"

  pre_tasks:
    - name: Check for deployment state file
      ansible.builtin.stat:
        path: "{{ state_file }}"
      register: _state_file_stat

    - name: Load deployment state if available
      block:
        - name: Try to load deployment state
          ansible.builtin.include_vars:
            file: "{{ state_file }}"
            name: _deployment
          register: _state_load_result
      rescue:
        - name: State file has YAML errors, will use simple destroy method
          ansible.builtin.set_fact:
            _state_file_corrupted: true
            _deployment: {}
      when: _state_file_stat.stat.exists

    - name: Set state file corruption flag if not set
      ansible.builtin.set_fact:
        _state_file_corrupted: false
      when: _state_file_corrupted is not defined

    - name: Load topology file as fallback
      ansible.builtin.include_vars:
        file: "{{ _topology_file_path }}"
        name: _topology
      when:
        - not _state_file_stat.stat.exists
        - not _state_file_corrupted

    - name: Set deployment variables from state or topology
      ansible.builtin.set_fact:
        _deployment_config: "{{ _deployment if (_state_file_stat.stat.exists and not _state_file_corrupted) else _topology }}"
      when: not _state_file_corrupted

    - name: Display destroy information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "WARNING: Destructive Operation"
          - "=========================================="
          - "Deployment Name: {{ deployment_name }}"
          - "Destroy Mode: {{ destroy_mode }}"
          - "ESXi Hosts to Remove: {{ _deployment_config.esxi_hosts | default([]) | length }}"
          - "vCenters to Remove: {{ _deployment_config.vcenter_vms | default([]) | length }}"
          - "=========================================="
          - "This will {{ 'remove all VMs' if destroy_mode == 'hard' else 'remove configuration only' }}"
          - "=========================================="

    - name: Confirm destruction
      ansible.builtin.pause:
        prompt: "Type 'yes' to confirm destruction, or Ctrl+C to abort"
      register: _destroy_confirm
      when: vsphere_interactive_mode | default(true) | bool

    - name: Validate confirmation
      ansible.builtin.fail:
        msg: "Destruction aborted - confirmation not received"
      when:
        - vsphere_interactive_mode | default(true) | bool
        - _destroy_confirm.user_input | default('') != 'yes'

  tasks:
    # Simple destroy method when state file is corrupted
    - name: "Simple Destroy: Find all nested VMs"
      community.vmware.vmware_vm_info:
        hostname: "{{ vsphere_parent_vcenter.hostname }}"
        username: "{{ vsphere_parent_vcenter.username }}"
        password: "{{ vsphere_parent_vcenter.password }}"
        validate_certs: false
      register: _vm_info
      when: _state_file_corrupted

    - name: "Simple Destroy: Filter nested VMs"
      ansible.builtin.set_fact:
        _nested_vms: "{{ _vm_info.virtual_machines | selectattr('guest_name', 'defined') | selectattr('guest_name', 'match', '^nested-.*') | list }}"
      when: _state_file_corrupted

    - name: "Simple Destroy: Delete all nested VMs"
      community.vmware.vmware_guest:
        hostname: "{{ vsphere_parent_vcenter.hostname }}"
        username: "{{ vsphere_parent_vcenter.username }}"
        password: "{{ vsphere_parent_vcenter.password }}"
        validate_certs: false
        name: "{{ item.guest_name }}"
        state: absent
        force: true
      loop: "{{ _nested_vms | default([]) }}"
      loop_control:
        label: "{{ item.guest_name }}"
      when: _state_file_corrupted

    # Phase 1: Remove DRS Host Groups (HostGroup zone_type only)
    - name: "Phase 1: Remove DRS Host Groups"
      community.vmware.vmware_drs_group:
        hostname: "{{ vcenter_vm.hostname }}"
        username: "{{ vcenter_vm.username | default('administrator@vsphere.local') }}"
        password: "{{ vcenter_vm.password }}"
        validate_certs: false
        cluster_name: "{{ fd.cluster }}"
        datacenter_name: "{{ fd.datacenter }}"
        group_name: "{{ fd.name }}"
        state: absent
      loop: >-
        {{
          _deployment_config.vcenter_vms | default([])
          | product(
              _deployment_config.failure_domains
              | selectattr('zone_type', 'defined')
              | selectattr('zone_type', 'equalto', 'HostGroup')
              | list
            )
          | list
        }}
      loop_control:
        label: "{{ vcenter_vm.hostname }} - {{ fd.name }}"
      vars:
        vcenter_vm: "{{ item[0] }}"
        fd: "{{ item[1] }}"
      when:
        - not _state_file_corrupted
        - destroy_mode in ['soft', 'hard']
      failed_when: false

    # Phase 2: Remove OpenShift Tags
    - name: "Phase 2: Remove OpenShift Tags"
      when:
        - not _state_file_corrupted
        - destroy_mode in ['soft', 'hard']
      block:
        - name: Remove zone tags from each vCenter
          community.vmware.vmware_tag:
            hostname: "{{ vcenter_vm.hostname }}"
            username: "{{ vcenter_vm.username | default('administrator@vsphere.local') }}"
            password: "{{ vcenter_vm.password }}"
            validate_certs: false
            tag_name: "{{ fd.zone }}"
            category_id: openshift-zone
            state: absent
          loop: "{{ _deployment_config.vcenter_vms | default([]) | product(_deployment_config.failure_domains | default([])) | list }}"
          loop_control:
            label: "{{ vcenter_vm.hostname }} - {{ fd.zone }}"
          vars:
            vcenter_vm: "{{ item[0] }}"
            fd: "{{ item[1] }}"
          failed_when: false

        - name: Remove region tags from each vCenter
          community.vmware.vmware_tag:
            hostname: "{{ vcenter_vm.hostname }}"
            username: "{{ vcenter_vm.username | default('administrator@vsphere.local') }}"
            password: "{{ vcenter_vm.password }}"
            validate_certs: false
            tag_name: "{{ _deployment_config.region | default('region-1') }}"
            category_id: openshift-region
            state: absent
          loop: "{{ _deployment_config.vcenter_vms | default([]) }}"
          loop_control:
            loop_var: vcenter_vm
            label: "{{ vcenter_vm.hostname }}"
          failed_when: false

        - name: Remove tag categories from each vCenter
          community.vmware.vmware_category:
            hostname: "{{ vcenter_vm.hostname }}"
            username: "{{ vcenter_vm.username | default('administrator@vsphere.local') }}"
            password: "{{ vcenter_vm.password }}"
            validate_certs: false
            category_name: "{{ category }}"
            state: absent
          loop: "{{ _deployment_config.vcenter_vms | default([]) | product(['openshift-region', 'openshift-zone']) | list }}"
          loop_control:
            label: "{{ vcenter_vm.hostname }} - {{ category }}"
          vars:
            vcenter_vm: "{{ item[0] }}"
            category: "{{ item[1] }}"
          failed_when: false

    # Phase 3-7: Simplified - just remove VMs in hard mode
    # For soft mode, we'd need to call each role's cleanup tasks
    # For now, simplified to just VM removal

    # Phase 8: Remove VMs (vCenter and ESXi)
    - name: "Phase 8: Remove Virtual Machines"
      block:
        - name: Power off and remove vCenter VMs
          community.vmware.vmware_guest:
            hostname: "{{ vsphere_parent_vcenter.hostname }}"
            username: "{{ vsphere_parent_vcenter.username }}"
            password: "{{ vsphere_parent_vcenter.password }}"
            validate_certs: "{{ vsphere_parent_vcenter.validate_certs | default(false) }}"
            name: "{{ item.name }}"
            state: absent
            force: true
          loop: "{{ _deployment_config.vcenter_vms | default([]) }}"
          loop_control:
            label: "{{ item.name }}"
          failed_when: false

        - name: Power off and remove ESXi VMs
          community.vmware.vmware_guest:
            hostname: "{{ vsphere_parent_vcenter.hostname }}"
            username: "{{ vsphere_parent_vcenter.username }}"
            password: "{{ vsphere_parent_vcenter.password }}"
            validate_certs: "{{ vsphere_parent_vcenter.validate_certs | default(false) }}"
            name: "{{ item.name }}"
            state: absent
            force: true
          loop: "{{ _deployment_config.esxi_hosts | default([]) }}"
          loop_control:
            label: "{{ item.name }}"
          failed_when: false
      when:
        - not _state_file_corrupted
        - destroy_mode == 'hard'

  post_tasks:
    - name: Destruction summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Nested vSphere Destruction Complete"
          - "=========================================="
          - "Deployment Name: {{ deployment_name }}"
          - "Destroy Mode: {{ destroy_mode }}"
          - "Resources Removed:"
          - "  - ESXi VMs: {{ _deployment_config.esxi_hosts | default([]) | length if destroy_mode == 'hard' else 0 }}"
          - "  - vCenter VMs: {{ _deployment_config.vcenter_vms | default([]) | length if destroy_mode == 'hard' else 0 }}"
          - "  - Configuration: {{ 'Yes' if destroy_mode in ['soft', 'hard'] else 'No' }}"
          - "=========================================="

    - name: Remove deployment state file
      ansible.builtin.file:
        path: "{{ state_file }}"
        state: absent
      when:
        - _state_file_stat.stat.exists
        - destroy_mode == 'hard'
