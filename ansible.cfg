[defaults]
# Role paths
roles_path = ./roles

# Inventory
inventory = ./inventory/hosts.yml
host_key_checking = False

# Retry files
retry_files_enabled = True
retry_files_save_path = ./.ansible-retry

# Output
stdout_callback = yaml
bin_ansible_callbacks = True
callback_whitelist = profile_tasks, timer, yaml

# Vault
# Create .vault_pass file with your vault password, or use environment variable
# vault_password_file = ./.vault_pass
# Alternative: Use environment variable ANSIBLE_VAULT_PASSWORD_FILE

# SSH
timeout = 30
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Performance
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./.ansible_cache
fact_caching_timeout = 86400

# Logging
log_path = ./ansible.log

# Disable host key checking for vSphere connections
[inventory]
enable_plugins = host_list, yaml, ini, auto

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
control_path = %(directory)s/%%h-%%r
