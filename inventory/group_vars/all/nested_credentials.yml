---
# Nested vSphere Credentials
# References vault variables with environment variable fallbacks for CI/CD

# Nested vCenter credentials
# Priority: 1. Vault variables, 2. Environment variables, 3. Fail
nested_vcenter_username: "administrator@{{ nested_vsphere_domain }}"
nested_vcenter_password: "{{ vault_nested_vcenter_password | default(lookup('ansible.builtin.env', 'NESTED_PASSWORD')) }}"

# Nested ESXi credentials
nested_esxi_username: "root"
nested_esxi_password: "{{ vault_nested_esxi_password | default(lookup('ansible.builtin.env', 'NESTED_PASSWORD')) }}"

# Parent vCenter credentials (if not using vault)
# These are already defined in connection.yml but can be overridden here if needed
# vault_parent_vcenter_password is referenced in connection.yml

# Validate that credentials are set
_credentials_check:
  - "{{ nested_vcenter_password | default('') | length > 0 }}"
  - "{{ nested_esxi_password | default('') | length > 0 }}"
