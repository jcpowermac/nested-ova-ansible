---
# Static inventory for nested vSphere deployment
# Most hosts will be added dynamically during deployment

all:
  children:
    # Localhost group for running deployment playbooks
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: auto_silent

    # Dynamic groups will be populated during deployment:
    # - deployed_esxi: ESXi VMs that have been deployed
    # - deployed_vcenter: vCenter VMs that have been deployed
    # - configured_hosts: ESXi hosts that have been added to vCenter
