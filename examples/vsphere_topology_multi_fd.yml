---
# Example: Multiple Failure Domains Topology
#
# This topology demonstrates multiple failure domains within a single vCenter.
# Suitable for:
#   - High-availability testing
#   - Multi-AZ OpenShift clusters
#   - Zone affinity testing
#
# Resources:
#   - 6 ESXi hosts (3 per zone)
#   - 1 vCenter
#   - 1 Datacenter with 1 Cluster
#   - 3 Failure Domains (ComputeCluster zone type)

deployment_name: multi-fd-lab
region: us-east-1

# ESXi Host Configuration (2 hosts per zone = 6 total)
esxi_hosts:
  # Zone A hosts
  - name: esxi-a1
    ip: 192.168.1.10
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 8
    memory_mb: 65536
    disk_gb: 200
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  - name: esxi-a2
    ip: 192.168.1.11
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 8
    memory_mb: 65536
    disk_gb: 200
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  # Zone B hosts
  - name: esxi-b1
    ip: 192.168.1.20
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 8
    memory_mb: 65536
    disk_gb: 200
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  - name: esxi-b2
    ip: 192.168.1.21
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 8
    memory_mb: 65536
    disk_gb: 200
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  # Zone C hosts
  - name: esxi-c1
    ip: 192.168.1.30
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 8
    memory_mb: 65536
    disk_gb: 200
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  - name: esxi-c2
    ip: 192.168.1.31
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 8
    memory_mb: 65536
    disk_gb: 200
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

# vCenter Configuration
vcenter_vms:
  - name: vcsa01
    hostname: vcsa01.lab.local
    ip: 192.168.1.5
    mask: 255.255.255.0
    gw: 192.168.1.1
    dns: 192.168.1.1
    domain: lab.local
    ntp: pool.ntp.org
    cpu: 12
    memory_mb: 32768  # 32 GB (more resources due to larger cluster)
    disk_gb: 300
    username: administrator@vsphere.local
    password: "{{ vault_vcenter_password }}"
    sso_domain: vsphere.local
    datacenter: dc1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

    datacenters:
      - name: dc1
        clusters:
          - name: cluster1
            drs_enabled: true
            drs_vmotion_rate: 3
            ha_enabled: true
            ha_admission_control: true
            ha_host_monitoring: enabled
            ha_vm_monitoring: vmMonitoringOnly

    dvswitches:
      - name: dvSwitch
        datacenter: dc1
        version: 7.0.0
        mtu: 1500
        uplinks: 2
        discovery_protocol: lldp
        discovery_operation: listen
        port_groups:
          - name: VM Network
            vlan: 0
            num_ports: 256
          - name: Storage Network
            vlan: 100
            num_ports: 128

    esxi_hosts:
      # Zone A
      - hostname: 192.168.1.10
        username: root
        password: "{{ vault_esxi_password }}"
        datacenter: dc1
        cluster: cluster1
      - hostname: 192.168.1.11
        username: root
        password: "{{ vault_esxi_password }}"
        datacenter: dc1
        cluster: cluster1
      # Zone B
      - hostname: 192.168.1.20
        username: root
        password: "{{ vault_esxi_password }}"
        datacenter: dc1
        cluster: cluster1
      - hostname: 192.168.1.21
        username: root
        password: "{{ vault_esxi_password }}"
        datacenter: dc1
        cluster: cluster1
      # Zone C
      - hostname: 192.168.1.30
        username: root
        password: "{{ vault_esxi_password }}"
        datacenter: dc1
        cluster: cluster1
      - hostname: 192.168.1.31
        username: root
        password: "{{ vault_esxi_password }}"
        datacenter: dc1
        cluster: cluster1

content_library:
  name: nested-vsphere-templates
  description: OVA templates for nested vSphere deployment
  datastore: "{{ vsphere_parent_vcenter.datastore }}"
  esxi_template_item: Nested_ESXi8.0u2c_Appliance_Template_v1
  vcenter_template_item: VMware-vCenter-Server-Appliance-8.0.2.00100

# Failure Domains (3 zones)
# Note: Using ComputeCluster zone_type means the entire cluster is tagged per zone
# For true zone isolation, use zone_type: HostGroup (see vsphere_topology_hostgroup.yml)
failure_domains:
  - name: zone-a
    region: us-east-1
    zone: zone-a
    zone_type: ComputeCluster
    datacenter: dc1
    cluster: cluster1
    vcenter:
      hostname: vcsa01.lab.local
      username: administrator@vsphere.local
      password: "{{ vault_vcenter_password }}"
      validate_certs: false

  - name: zone-b
    region: us-east-1
    zone: zone-b
    zone_type: ComputeCluster
    datacenter: dc1
    cluster: cluster1
    vcenter:
      hostname: vcsa01.lab.local
      username: administrator@vsphere.local
      password: "{{ vault_vcenter_password }}"
      validate_certs: false

  - name: zone-c
    region: us-east-1
    zone: zone-c
    zone_type: ComputeCluster
    datacenter: dc1
    cluster: cluster1
    vcenter:
      hostname: vcsa01.lab.local
      username: administrator@vsphere.local
      password: "{{ vault_vcenter_password }}"
      validate_certs: false

# Note: With ComputeCluster zone_type, OpenShift will spread workloads across the cluster
# but won't enforce strict zone affinity. For strict affinity, use HostGroup zone_type.

wait_for_ip: true
vm_wait_timeout: 900
vsphere_debug_mode: false
