---
# Example: HostGroup Affinity Topology
#
# This topology uses DRS Host Groups to enforce strict zone affinity.
# Suitable for:
#   - Strict failure domain isolation
#   - OpenShift deployments requiring zone-pinned workloads
#   - Testing zone-specific failures
#
# Key difference from multi-FD:
#   - zone_type: HostGroup creates DRS host groups
#   - Each zone has specific ESXi hosts assigned
#   - OpenShift can pin VMs to specific zones via host groups
#
# Resources:
#   - 9 ESXi hosts (3 per zone)
#   - 1 vCenter
#   - 1 Datacenter with 1 Cluster
#   - 3 Failure Domains with HostGroup zone type
#   - 3 DRS Host Groups (one per zone)

deployment_name: hostgroup-lab
region: us-west-1

# ESXi Host Configuration (3 hosts per zone = 9 total)
esxi_hosts:
  # Zone A hosts
  - name: esxi-a1
    ip: 192.168.1.10
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 12
    memory_mb: 98304  # 96 GB
    disk_gb: 300
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  - name: esxi-a2
    ip: 192.168.1.11
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 12
    memory_mb: 98304
    disk_gb: 300
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  - name: esxi-a3
    ip: 192.168.1.12
    mask: 255.255.255.0
