    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  # Zone B hosts
  - name: esxi-b1
    ip: 192.168.1.20
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 12
    memory_mb: 98304
    disk_gb: 300
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  - name: esxi-b2
    ip: 192.168.1.21
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
    cpu: 12
    memory_mb: 98304
    disk_gb: 300
    nested_hv: true
    username: root
    password: "{{ vault_esxi_password }}"
    datacenter: dc1
    cluster: cluster1
    folder: /nested-lab
    parent_resource_pool: nested-vsphere
    parent_host: "{{ vsphere_parent_vcenter.esxi_host }}"
    parent_datastore: "{{ vsphere_parent_vcenter.datastore }}"

  - name: esxi-b3
    ip: 192.168.1.22
    mask: 255.255.255.0
    gw: 192.168.1.1
    vlan: 0
